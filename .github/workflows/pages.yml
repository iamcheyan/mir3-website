name: Build and deploy GitHub Pages

on:
  push:
    branches: [main, feature/data-alignment-audit-20260927]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site build dependencies
        run: python -m pip install --disable-pip-version-check "Flask==3.1.3" "Jinja2==3.1.6"
      - name: Validate master data and contract tests
        run: |
          python -m unittest tests.test_alignment -v
          python tools/alignment.py validate data/alignment/master.json
      - name: Build static site
        run: python app.py build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}{{ site.name }}{% endblock %}</title>
<meta name="description" content="传奇3 资料站 · 怪物图鉴 / 物品大全 / 技能资料 / 任务攻略 / 地图资料">
<link rel="stylesheet" href="{{ prefix }}/static/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>卍</text></svg>">
</head>
<body>
<a class="skip-link" href="#main-content">跳到主要内容</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="{{ prefix }}/index.html" aria-label="返回传奇3资料站首页">
      <span class="logo-mark" aria-hidden="true">参</span>
      <span class="logo-copy"><strong>传奇三</strong><small> MIR3 · ARCHIVE</small></span>
    </a>
    <nav class="main-nav" aria-label="主导航">
      {% for n, url, key in NAV %}
      <a href="{{ prefix }}/{{ url }}" class="nav-link{% if section == key %} active{% endif %}"><span>{{ "%02d"|format(loop.index0) }}</span>{{ n }}</a>
      {% endfor %}
    </nav>
  </div>
</header>

<main id="main-content" class="container page-main">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p><span class="footer-mark">伝</span> {{ site.copyright }}</p>
    <p class="footer-meta">资料整理自 17173 传奇3 专区镜像 · 个人研究用途</p>
  </div>
</footer>
<script src="{{ prefix }}/static/js/main.js"></script>
</body>
</html>
